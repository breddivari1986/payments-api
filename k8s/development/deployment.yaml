apiVersion: v1
kind: Namespace
metadata:
  name: payment
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: payment
  labels: { app: payments-api }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: payments-api }
  template:
    metadata:
      labels: { app: payments-api }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: payments-api
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: APP_VERSION
              value: VERSION_PLACEHOLDER
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
      terminationGracePeriodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: payment
  labels: { app: payments-api }
spec:
  type: ClusterIP
  selector: { app: payments-api }
  ports:
    - name: http
      port: 80
      targetPort: 8080
